<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Newton, o teu ajudante para estudar Físico-Química." />
    <title>Newton</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header class="app-bar" id="app-bar">
      <span class="avatar" aria-hidden="true"><md-icon>science</md-icon></span>
      <div class="app-bar__texto">
        <h1 class="md-typescale-title-large">Newton</h1>
        <p class="md-typescale-body-medium app-bar__sub">O teu ajudante de Físico-Química</p>
      </div>
      <md-icon-button id="nova-conversa" aria-label="Nova conversa" title="Nova conversa">
        <md-icon>edit_square</md-icon>
      </md-icon-button>
    </header>

    <main class="conversa" id="conversa">
      <div class="coluna">
        <section class="boas-vindas" aria-labelledby="boas-vindas-titulo">
          <span class="avatar avatar--grande" aria-hidden="true"><md-icon>science</md-icon></span>
          <h2 id="boas-vindas-titulo" class="md-typescale-headline-small">Olá! Sou o Newton.</h2>
          <p class="md-typescale-body-large">
            Estou aqui para te ajudar a estudar Físico&#8209;Química. Escolhe um tema ou escreve a tua dúvida.
          </p>
          <md-chip-set id="temas-iniciais" aria-label="Temas para começar"></md-chip-set>
        </section>

        <div class="mensagens" id="mensagens" role="log" aria-live="polite" aria-label="Conversa com o Newton"></div>
      </div>
    </main>

    <footer class="compositor">
      <form class="compositor__form coluna" id="formulario">
        <md-filled-text-field
          id="campo"
          class="composer-field"
          placeholder="Escreve a tua dúvida…"
          aria-label="Escreve a tua dúvida"
        ></md-filled-text-field>
        <md-filled-icon-button id="enviar" type="submit" aria-label="Enviar" disabled>
          <md-icon>send</md-icon>
        </md-filled-icon-button>
      </form>
      <p class="md-typescale-body-small compositor__nota">
        O Newton dá respostas simples e ainda está a aprender. Em caso de dúvida, confirma com o teu professor.
      </p>
    </footer>
  </body>
</html>
